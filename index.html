<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090D">
<meta name="description" content="PIZNO: демо мобільного застосунку прокату авто. Каталог за класами, календар вільних дат, токени лояльності, подарункові сертифікати й панель власника.">
<meta property="og:title" content="PIZNO Прокат авто">
<meta property="og:description" content="Інтерактивне демо застосунку для прокату авто">
<link rel="icon" href="assets/duck-black.png" type="image/png">
<link rel="apple-touch-icon" href="assets/duck-black.png">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>PIZNO Прокат авто</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone-frame app on a dark striped stage; one screen visible at a time, tab bar + sticky CTA bars.
   Single deliberate dark look: graphite neutrals biased to blue, one electric-blue accent used only for focus, selection and the floor light under cars. */
:root{
  --bg:#07090D; --bg-2:#0B0E14; --surface:#10141C; --surface-2:#161B25; --line:#212937; --line-2:#2D3647;
  --text:#ECEFF5; --muted:#949DAF; --dim:#646D80;
  --blue:#2E5BFF; --blue-hi:#7D98FF; --blue-deep:#101D4F; --glow:rgba(46,91,255,.42); --on-blue:#FFFFFF;
  --ok:#45D49B; --warn:#F2B544; --bad:#FF6372;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.label{font:600 11px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ---------- stage ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:64px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:repeating-linear-gradient(90deg,transparent 0 119px,rgba(125,152,255,.045) 119px 120px),radial-gradient(900px 500px at 70% 40%,rgba(46,91,255,.10),transparent 70%),var(--bg)}
.pitch{max-width:340px;display:none;flex-direction:column;gap:22px}
.pitch h1{font:700 30px/1.15 var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.pitch p{margin:0;color:var(--muted)}
.pitch ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pitch li button{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);text-align:left;transition:border-color .2s,background .2s}
.pitch li button:hover{border-color:var(--line-2);background:var(--surface)}
.pitch li button[aria-current="true"]{border-color:var(--blue);background:var(--surface)}
.pitch li .label{width:22px;color:var(--dim)}
.pitch small{color:var(--dim);font-size:12px}
@media (min-width:1000px){.pitch{display:flex}}

.device{position:relative;flex:none;width:390px;height:min(844px,calc(100vh - 48px));min-height:640px;border-radius:48px;overflow:hidden;background:var(--bg);
  box-shadow:0 0 0 1px var(--line-2),0 0 0 10px #040508,0 0 0 11px var(--line),0 50px 120px rgba(0,0,0,.7)}
.statusbar{position:absolute;top:0;left:0;right:0;height:48px;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 36px;font:600 15px var(--f-body);pointer-events:none}
.statusbar::after{content:"";position:absolute;left:50%;top:11px;width:118px;height:33px;border-radius:20px;background:#000;transform:translateX(-50%)}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
@media (max-width:519px){
  .stage{display:block;padding:0;min-height:0;height:100%;background:var(--bg)}
  .device{width:100%;height:100%;min-height:0;border-radius:0;box-shadow:none;--dev-r:0px}
  .statusbar{display:none}
}
@media (min-width:520px){ .screen{padding-top:52px} }

/* ---------- screens ---------- */
.screens{position:absolute;inset:0;overflow:hidden;clip-path:inset(0 round var(--dev-r,48px))}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:120px;scrollbar-width:none;opacity:0;visibility:hidden;transform:translateX(18px);transition:opacity .28s var(--ease),transform .32s var(--ease),visibility 0s .32s;background:var(--bg)}
.screen::-webkit-scrollbar{display:none}
.screen.on{opacity:1;visibility:visible;transform:none;transition:opacity .28s var(--ease),transform .32s var(--ease)}
.screen.push{padding-bottom:0}
.pad{padding-inline:20px}
.stack{display:flex;flex-direction:column}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 8px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);transition:transform .15s,border-color .2s}
.iconbtn:active{transform:scale(.94)}
.iconbtn[aria-pressed="true"]{color:var(--bad);border-color:rgba(255,99,114,.4)}
.iconbtn[aria-pressed="true"] .ico{fill:currentColor}
.h-screen{font:700 22px/1.2 var(--f-display);margin:0;letter-spacing:-.01em}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.section-h h2{font:700 16px/1.2 var(--f-display);margin:0}
.link{color:var(--blue-hi);font-weight:600;font-size:14px;padding:6px 0}

/* brand */
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(160deg,#18213d,#0b0e16);border:1px solid var(--line-2);display:grid;place-items:end center;overflow:hidden}
.brand-mark img{width:88%;height:auto;margin-bottom:-6%}
.wordmark{display:block;width:auto;filter:drop-shadow(0 0 1px rgba(0,0,0,.6))}
.car-img{display:block;max-width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.brand-name{font:700 17px var(--f-display);letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.pill .ico{width:16px;height:16px}
.token-pill{color:var(--blue-hi)}

.greet{padding:6px 20px 0}
.greet p{margin:0;color:var(--muted)}
.greet h1{font:700 26px/1.15 var(--f-display);margin:4px 0 0;letter-spacing:-.015em;text-wrap:balance}

/* banners (ref: sneaker app hero card) */
.banners{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 20px 0;scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
.banner{position:relative;flex:0 0 100%;min-height:232px;border-radius:var(--r-l);padding:20px;scroll-snap-align:center;overflow:hidden;border:1px solid var(--line-2);isolation:isolate;
  background:radial-gradient(70% 60% at 85% 85%,rgba(46,91,255,.45),transparent 70%),linear-gradient(160deg,#0f1838 0%,#0a0e1c 55%,#07090d 100%)}
.banner::before{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;z-index:-1;opacity:.55;
  background:repeating-linear-gradient(90deg,rgba(125,152,255,.16) 0 1px,transparent 1px 34px),linear-gradient(180deg,transparent,rgba(46,91,255,.12));
  -webkit-mask:linear-gradient(180deg,transparent,#000 70%);mask:linear-gradient(180deg,transparent,#000 70%);transform:perspective(220px) rotateX(48deg);transform-origin:bottom}
.banner.b2{background:radial-gradient(70% 60% at 85% 85%,rgba(125,152,255,.30),transparent 70%),linear-gradient(160deg,#171b26,#0b0d13 60%)}
.banner.b3{background:radial-gradient(70% 60% at 85% 85%,rgba(46,91,255,.38),transparent 70%),linear-gradient(160deg,#10131c,#07080c 60%)}
.banner .eyebrow{color:var(--blue-hi)}
.banner .idx{position:absolute;top:18px;right:18px;font:600 11px var(--f-mono);color:var(--dim);letter-spacing:.1em}
.banner h3{font:700 25px/1.08 var(--f-display);margin:10px 0 8px;white-space:pre-line;letter-spacing:-.015em;text-wrap:balance;max-width:72%}
.banner p{margin:0 0 16px;color:#C2C9D8;font-size:13px;max-width:46%;line-height:1.4}
.banner .tag{display:inline-flex;align-items:center;gap:6px;margin-left:8px;font:600 12px var(--f-mono);color:#C2C9D8}
.banner .car-art{position:absolute;right:-34px;bottom:10px;width:236px;z-index:-1;pointer-events:none}
.banner .car-art img{display:block;width:100%;height:auto;filter:drop-shadow(0 16px 12px rgba(0,0,0,.75))}
.banner .car-art::after{content:"";position:absolute;left:12%;right:6%;bottom:-2px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(125,152,255,.9),transparent);filter:blur(1px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14px;transition:transform .15s,background .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn-white{background:#fff;color:#0A0D14}
.btn-blue{background:var(--blue);color:var(--on-blue);box-shadow:0 8px 28px -8px var(--glow)}
.btn-blue:hover{background:#3A66FF}
.btn-ghost{border:1px solid var(--line-2);background:var(--surface)}
.btn[disabled]{opacity:.4;pointer-events:none}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots button{width:24px;height:24px;display:grid;place-items:center}
.dots button::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--line-2);transition:width .25s,background .25s}
.dots button[aria-current="true"]::before{width:18px;background:var(--blue-hi)}

/* class chips (ref: category row) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:86px;padding:10px 14px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .2s,background .2s}
.chip b{font-weight:600;font-size:14px}
.chip span{font:500 11px var(--f-mono);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip[aria-pressed="true"] span{color:rgba(255,255,255,.75)}

/* carousel (ref: food picker) */
.carousel-wrap{position:relative;margin-top:6px;container-type:inline-size}
.carousel-wrap::before{content:"";position:absolute;left:50%;top:44%;width:300px;height:230px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(46,91,255,.30),transparent 75%);pointer-events:none}
.carousel{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding:30px 19cqw 4px;scrollbar-width:none;overscroll-behavior-x:contain}
.carousel::-webkit-scrollbar{display:none}
.c-item{flex:0 0 62cqw;scroll-snap-align:center;--d:0;transform:scale(calc(1 - var(--d) * .48)) translateY(calc(var(--d) * 22px));opacity:calc(1 - var(--d) * .55);transition:transform .12s linear;padding:0 2px}
.c-item img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;filter:drop-shadow(0 18px 14px rgba(0,0,0,.7))}
.c-arrows{position:absolute;inset:auto 8px 8px;display:flex;justify-content:space-between;pointer-events:none}
.c-arrows .iconbtn{pointer-events:auto;width:40px;height:40px;background:rgba(16,20,28,.8)}
.focus{text-align:center;padding:4px 20px 0;min-height:118px}
.focus .cls-tag{display:inline-flex;align-items:center;gap:6px}
.focus .cls-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue-hi)}
.focus h3{font:700 21px/1.2 var(--f-display);margin:8px 0 4px;letter-spacing:-.01em}
.focus .price{font:700 20px var(--f-display);margin-top:6px}
.focus .price small{font:500 13px var(--f-body);color:var(--muted)}
.focus .hint{display:block;margin-top:10px;color:var(--dim);font-size:13px}
.fade-in{animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* teaser cards */
.teasers{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.tcard{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:150px;padding:16px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);text-align:left;overflow:hidden}
.tcard .big{font:700 26px/1 var(--f-display)}
.tcard p{margin:0;color:var(--muted);font-size:13px;line-height:1.35}
.tcard .ico{color:var(--blue-hi);width:22px;height:22px}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--blue-hi))}

/* catalog grid (ref: top picks) */
.search{display:flex;align-items:center;gap:10px;height:50px;margin:8px 20px 16px;padding:0 16px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none}
.search input::placeholder{color:var(--dim)}
.search:focus-within{border-color:var(--blue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px 0}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--r-l);border:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2),var(--surface));overflow:hidden;text-align:left;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--line-2)}
.card:active{transform:scale(.985)}
.card .art{padding:36px 10px 0}
.card .art img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;filter:drop-shadow(0 10px 8px rgba(0,0,0,.65))}
.card .body{padding:6px 14px 14px;display:flex;flex-direction:column;gap:2px}
.card h3{margin:0;font-weight:600;font-size:15px;line-height:1.25}
.card .sub{color:var(--muted);font-size:12px}
.card .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.card .p{font:700 15px var(--f-display)}
.card .p small{font:500 11px var(--f-body);color:var(--muted)}
.card .go{width:34px;height:34px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff}
.card .go .ico{width:16px;height:16px}
.card .badge{position:absolute;top:10px;left:10px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted)}
.badge .ico{width:12px;height:12px}
.badge.ev{color:var(--ok);border-color:rgba(69,212,155,.35)}
.badge.last{color:var(--warn);border-color:rgba(242,181,68,.35)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* detail (ref: product page) */
.hero{position:relative;height:300px;overflow:hidden}
.hero .ghost{position:absolute;left:0;right:0;top:64px;text-align:center;font:700 74px/1 var(--f-display);color:transparent;-webkit-text-stroke:1px var(--line-2);letter-spacing:.02em;user-select:none;white-space:nowrap}
.hero .floor{position:absolute;left:8%;right:8%;bottom:30px;height:70px;background:radial-gradient(closest-side,rgba(46,91,255,.55),rgba(46,91,255,.12) 55%,transparent);filter:blur(6px)}
.hero .floor::after{content:"";position:absolute;left:18%;right:18%;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(125,152,255,.8),transparent)}
.hero .car{position:absolute;left:16px;right:16px;bottom:26px}
.hero .car img{display:block;width:100%;height:220px;object-fit:contain;filter:drop-shadow(0 24px 18px rgba(0,0,0,.75))}
.drive-in{animation:drive .9s var(--ease) both}
.drive-in .spokes{animation:spin .9s var(--ease) both}
@keyframes drive{from{transform:translateX(-60%);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{from{transform:rotate(-540deg)}to{transform:none}}
.spokes{transform-box:fill-box;transform-origin:center}
.hero .topbar{position:absolute;left:0;right:0;top:0;z-index:2}
.sheet-panel{position:relative;margin-top:-6px;border-radius:28px 28px 0 0;background:var(--bg-2);border-top:1px solid var(--line);padding:22px 20px 0}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.title-row h1{font:700 23px/1.15 var(--f-display);margin:6px 0 4px;letter-spacing:-.01em;text-wrap:balance}
.rating{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.rating .stars{display:flex;gap:1px;color:var(--warn)}
.rating .stars .ico{width:14px;height:14px;fill:currentColor;stroke:none}
.price-box{flex:none;text-align:right;padding:10px 12px;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface)}
.price-box b{display:block;font:700 18px var(--f-display);white-space:nowrap}
.tariffs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.tariff{padding:10px 6px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);text-align:center}
.tariff .label{font-size:10px}
.tariff b{display:block;margin-top:4px;font:700 14px var(--f-display)}
.tariff em{display:block;font:500 11px var(--f-mono);font-style:normal;color:var(--ok);margin-top:2px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.spec{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);min-width:0}
.spec .ico{color:var(--blue-hi);width:18px;height:18px}
.spec b{font-weight:600;font-size:14px;line-height:1.2}
.spec span{font-size:11px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .2s,background .2s}
.opt .ico{color:var(--muted)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-weight:600;font-size:14px}
.opt .t span{font-size:12px;color:var(--muted)}
.opt .sw{width:42px;height:24px;border-radius:12px;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.opt .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.opt[aria-pressed="true"]{border-color:rgba(46,91,255,.6);background:linear-gradient(90deg,rgba(46,91,255,.10),var(--surface))}
.opt[aria-pressed="true"] .ico{color:var(--blue-hi)}
.opt[aria-pressed="true"] .sw{background:var(--blue)}
.opt[aria-pressed="true"] .sw::after{transform:translateX(18px)}
.cta-bar{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));margin-top:24px;background:linear-gradient(180deg,rgba(11,14,20,0),var(--bg-2) 28%)}
.cta-bar .btn-blue{flex:1;height:56px;font-size:16px}
.cta-bar .iconbtn{width:56px;height:56px}

/* booking (ref: wellness app) */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dayc{flex:none;width:54px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;color:var(--muted)}
.dayc .c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font:700 15px var(--f-display);color:var(--text);transition:all .25s var(--ease)}
.dayc small{font:600 11px var(--f-mono);text-transform:uppercase}
.dayc[aria-pressed="true"] .c{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 5px rgba(46,91,255,.16),0 0 26px var(--glow);transform:scale(1.08)}
.dayc[aria-pressed="true"]{color:var(--text)}
.dayc[disabled]{opacity:.35;cursor:not-allowed}
.dayc[disabled] .c{text-decoration:line-through}
.bk-car{display:flex;align-items:center;gap:14px;margin:6px 20px 0;padding:12px 14px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface)}
.bk-car img{width:120px;aspect-ratio:16/10;object-fit:contain;flex:none}
.bk-car b{display:block;font-weight:600}
.bk-car span{color:var(--muted);font-size:13px}
.demand{margin:10px 20px 0;padding:16px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.demand .big{font:700 34px/1 var(--f-display);margin-top:8px}
.demand p{margin:6px 0 0;font-size:12px;color:var(--muted);max-width:170px}
.bars{display:flex;gap:6px;align-items:flex-end;height:72px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:4px}
.bars i{display:block;width:12px;border-radius:4px;background:var(--surface-2);position:relative;overflow:hidden;height:56px}
.bars i b{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--blue-hi),var(--blue));border-radius:4px}
.bars small{font:500 10px var(--f-mono);color:var(--dim)}
.cal{margin:0 20px;padding:14px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font:700 15px var(--f-display)}
.cal-head .iconbtn{width:36px;height:36px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0}
.cal-grid .wd{text-align:center;font:600 10px var(--f-mono);color:var(--dim);padding:4px 0;text-transform:uppercase}
.cd{position:relative;height:42px;display:grid;place-items:center;font-weight:600;font-size:14px}
.cd span{position:relative;z-index:1;width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.cd.in::before{content:"";position:absolute;inset:4px 0;background:rgba(46,91,255,.16)}
.cd.s::before{left:50%}
.cd.e::before{right:50%}
.cd.s span,.cd.e span{background:var(--blue);color:#fff;box-shadow:0 0 18px var(--glow)}
.cd.last span::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--warn)}
.cd.busy,.cd.past{color:var(--dim);cursor:not-allowed}
.cd.busy span{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:1.5px}
.cd.today span{border:1px solid var(--line-2)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.cal-msg{margin:10px 0 0;padding:10px 12px;border-radius:var(--r-s);font-size:13px;background:rgba(255,99,114,.10);color:#FFB3BA;border:1px solid rgba(255,99,114,.25)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--text);color:#0A0D14;border-color:var(--text)}
.places{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.place{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);text-align:left;min-height:76px;transition:border-color .2s}
.place b{font-weight:600;font-size:14px;line-height:1.25}
.place span{font:500 12px var(--f-mono);color:var(--muted)}
.place[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.summary{margin:0 20px;padding:16px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface)}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px}
.sum-row span:first-child{color:var(--muted)}
.sum-row.disc span:last-child{color:var(--ok)}
.sum-row.total{border-top:1px dashed var(--line-2);margin-top:6px;padding-top:12px;font-weight:700}
.sum-row.total span:last-child{font:700 20px var(--f-display)}
.note{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.45}

/* rewards (ref: insights gauge) */
.gauge{position:relative;margin:4px auto 0;width:280px;max-width:100%}
.gauge > svg{display:block;width:100%;height:auto}
.lvl-chip .ico{width:14px;height:14px}
.gauge .mid{position:absolute;left:0;right:0;top:44%;text-align:center}
.gauge .mid b{display:block;font:700 40px/1 var(--f-display);letter-spacing:-.02em}
.gauge .mid span{color:var(--muted);font-size:13px}
.lvl-chip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12px;font-weight:600}
.levels{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.lvl{flex:0 0 150px;padding:14px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.lvl b{font:700 15px var(--f-display)}
.lvl .pct{font:700 24px var(--f-display);color:var(--blue-hi)}
.lvl p{margin:0;font-size:12px;color:var(--muted);line-height:1.35}
.lvl.cur{border-color:var(--blue);background:linear-gradient(160deg,rgba(46,91,255,.18),var(--surface) 60%)}
.lvl.black{background:linear-gradient(160deg,#1a1d24,#07080b);border-color:#3a4152}
.act{padding:16px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface)}
.act-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:12px}
.act-grid i{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line)}
.act-grid i.l1{background:rgba(46,91,255,.35);border-color:transparent}
.act-grid i.l2{background:var(--blue);border-color:transparent}
.act-grid i.l3{background:#fff;border-color:transparent}
.act-months{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:6px;font:500 9px var(--f-mono);color:var(--dim);text-align:center}
.missions{display:flex;flex-direction:column;gap:8px}
.mission{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)}
.mission .mi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--blue-hi);flex:none}
.mission .t{flex:1;min-width:0}
.mission .t b{display:block;font-weight:600;font-size:14px}
.mission .t span{font-size:12px;color:var(--muted)}
.mission .rw{font:700 13px var(--f-mono);color:var(--blue-hi);white-space:nowrap}

/* gifts */
.cert{position:relative;margin:6px 20px 0;aspect-ratio:1.62;max-width:calc(100% - 40px);border-radius:20px;padding:20px;overflow:hidden;border:1px solid #2b3550;
  background:radial-gradient(120% 90% at 100% 100%,rgba(46,91,255,.35),transparent 55%),linear-gradient(150deg,#141a2b,#06070b 70%);display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 30px 60px -30px rgba(46,91,255,.5)}
.cert::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.025) 22px 23px)}
.cert > *{position:relative}
.cert .top{display:flex;justify-content:space-between;align-items:center}
.cert .amt{font:700 38px/1 var(--f-display);letter-spacing:-.02em}
.cert .amt small{font-size:18px;color:var(--blue-hi)}
.cert .to{font-size:13px;color:#C2C9D8}
.cert .code{font:600 12px var(--f-mono);letter-spacing:.14em;color:var(--muted)}
.cert .car-line{position:absolute;right:-26px;top:30%;width:220px;filter:drop-shadow(0 14px 12px rgba(0,0,0,.7))}
.cert .car-line img{width:100%}
.cert .duck-art{position:absolute;right:-2px;top:36px;width:124px;transform:rotate(-7deg);filter:drop-shadow(0 0 26px rgba(46,91,255,.55))}
.cert .duck-art img{width:100%;height:auto;display:block}
.cert .emv{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#d9dee8,#8b93a3 55%,#c7ccd6);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.cert .emv::before{content:"";position:absolute;inset:6px 0;border-top:1px solid rgba(0,0,0,.3);border-bottom:1px solid rgba(0,0,0,.3)}
.cert .emv::after{content:"";position:absolute;inset:0 13px;border-left:1px solid rgba(0,0,0,.3);border-right:1px solid rgba(0,0,0,.3)}
.cert .mid{display:flex;align-items:center;gap:10px;color:var(--muted)}
.cert.mini{margin:0 0 14px;max-width:100%}
.cert.flip{animation:flip .9s var(--ease) both}
@keyframes flip{from{opacity:0;transform:perspective(900px) rotateY(-70deg) scale(.9)}to{opacity:1;transform:none}}
.channels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.channels button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600}
.channels button .ico{color:var(--blue-hi)}
.channels button[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.sent{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-m);background:rgba(69,212,155,.10);color:var(--ok);font-weight:600;font-size:14px}
.greet-card{text-align:center;margin-bottom:14px}
.greet-card .label{color:var(--blue-hi)}
.greet-card h2{margin:8px 0 4px}
.greet-card blockquote{margin:12px 0 0;padding:12px 14px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);font-size:14px;color:#C2C9D8;text-align:left}
.phone{display:flex;align-items:center;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)}
.phone:focus-within{border-color:var(--blue)}
.phone span{padding:0 4px 0 14px;font-weight:600;color:var(--muted)}
.phone input{border:0!important;background:none!important;padding-left:4px!important}
.field.bad input,.field.bad .phone{border-color:var(--bad)}
.steps{display:flex;gap:6px;justify-content:center;margin:-4px 0 14px}
.steps i{width:22px;height:4px;border-radius:2px;background:var(--line-2)}
.steps i.on{background:var(--blue-hi)}
.bsum{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);margin-bottom:16px}
.bsum img{width:84px;aspect-ratio:16/10;object-fit:contain}
.bsum b{display:block;font-size:14px}
.bsum span{font-size:12px;color:var(--muted)}

.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.amounts button{height:48px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);font:700 13px var(--f-display);transition:all .2s}
.amounts button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.exps{display:flex;flex-direction:column;gap:8px}
.exp{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .2s}
.exp img{width:96px;aspect-ratio:16/10;object-fit:contain;flex:none}
.exp .t{flex:1;min-width:0}
.exp .t b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.exp .t span{font-size:12px;color:var(--muted)}
.exp .p{font:700 14px var(--f-display);white-space:nowrap}
.exp[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field textarea{width:100%;padding:13px 14px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);outline:none;resize:none}
.field input:focus,.field textarea:focus{border-color:var(--blue)}
.field .err{font-size:12px;color:#FFB3BA}

/* profile */
.me{display:flex;align-items:center;gap:14px;padding:6px 20px 0}
.avatar{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--f-display);background:linear-gradient(135deg,var(--blue),#0d1a52);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--blue)}
.me h1{font:700 19px/1.2 var(--f-display);margin:0}
.me p{margin:4px 0 0;color:var(--muted);font-size:13px}
.rows{display:flex;flex-direction:column;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);overflow:hidden}
.rowi{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-bottom:1px solid var(--line);text-align:left}
.rowi:last-child{border-bottom:0}
.rowi .ico{color:var(--muted)}
.rowi .t{flex:1;min-width:0}
.rowi .t b{display:block;font-weight:600;font-size:14px}
.rowi .t span{font-size:12px;color:var(--muted)}
.ok{color:var(--ok);font:600 12px var(--f-mono);display:inline-flex;align-items:center;gap:4px}
.ok .ico{width:14px;height:14px}
.trip{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface)}
.trip img{width:100px;aspect-ratio:16/10;object-fit:contain;flex:none}
.trip .t{flex:1;min-width:0}
.trip .t b{display:block;font-weight:600;font-size:14px}
.trip .t span{font-size:12px;color:var(--muted)}
.trip.active{border-color:var(--blue);background:linear-gradient(120deg,rgba(46,91,255,.14),var(--surface) 70%)}
.owner-card{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:var(--r-l);border:1px solid var(--blue);background:linear-gradient(120deg,var(--blue-deep),var(--surface) 75%);text-align:left}
.owner-card .ico{width:26px;height:26px;color:var(--blue-hi)}
.owner-card b{display:block;font:700 15px var(--f-display)}
.owner-card span{font-size:13px;color:#C2C9D8}

/* owner panel */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:14px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi b{font:700 21px/1.1 var(--f-display);white-space:nowrap}
.kpi .delta{font:600 12px var(--f-mono);color:var(--ok)}
.chart{padding:16px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface)}
.chart svg{display:block;width:100%;height:auto;margin-top:10px}
.fleet{display:flex;flex-direction:column;gap:6px}
.fl{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)}
.fl img{width:84px;aspect-ratio:16/10;object-fit:contain;flex:none}
.fl .t{flex:1;min-width:0}
.fl .t b{display:block;font-weight:600;font-size:13px}
.fl .t span{font:500 11px var(--f-mono);color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:600 11px var(--f-body);white-space:nowrap;border:1px solid var(--line-2)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.rent{color:var(--blue-hi)}
.st.free{color:var(--ok)}
.st.wash{color:#8FD3FF}
.st.service{color:var(--warn)}

/* splash */
.splash{position:absolute;inset:0;z-index:60;clip-path:inset(0 round var(--dev-r,48px));display:grid;place-items:center;background:radial-gradient(60% 40% at 50% 46%,rgba(46,91,255,.28),transparent 70%),var(--bg);transition:opacity .5s var(--ease),visibility 0s .5s}
.splash.out{opacity:0;visibility:hidden}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:16px;animation:pop .7s var(--ease) both}
.splash-duck img{width:132px;height:auto;filter:drop-shadow(0 0 28px rgba(46,91,255,.45))}
.splash-word img{height:44px;width:auto}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
.credits{font-size:12px;color:var(--muted);line-height:1.5}
.credits summary{cursor:pointer;padding:14px;font-weight:600;color:var(--text);list-style:none;display:flex;justify-content:space-between}
.credits ul{margin:0;padding:0 14px 14px 30px}
/* tab bar */
.tabbar{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;height:68px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-radius:34px;background:rgba(16,20,28,.86);border:1px solid var(--line-2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .35s var(--ease),opacity .25s}
.tabbar.hide{transform:translateY(130%);opacity:0;pointer-events:none}
.tab{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:10px;font-weight:600;transition:color .2s}
.tab .ico{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--text)}
.tab.center span.cbtn{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(7,9,13,.9),0 10px 30px -6px var(--glow);transform:translateY(-14px);transition:transform .2s}
.tab.center span.cbtn .ico{width:24px;height:24px}
.tab.center span.lbl{margin-top:-10px}
.tab.center[aria-current="page"] span.cbtn{transform:translateY(-14px) scale(1.06)}

/* bottom sheet */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(3,4,7,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;animation:fade .25s}
.bsheet{width:100%;max-height:92%;overflow-y:auto;border-radius:28px 28px 0 0;background:var(--bg-2);border-top:1px solid var(--line-2);padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .4s var(--ease)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 16px}
.success-ic{width:72px;height:72px;margin:6px auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--blue);box-shadow:0 0 0 8px rgba(46,91,255,.14),0 0 40px var(--glow)}
.success-ic .ico{width:34px;height:34px;color:#fff;stroke-width:2.4}
.bsheet h2{text-align:center;font:700 21px var(--f-display);margin:0 0 6px}
.bsheet .lead{text-align:center;color:var(--muted);margin:0 0 18px;font-size:14px}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:var(--r-m);border:1px dashed var(--line-2);background:var(--surface)}
.codebox b{font:600 20px var(--f-mono);letter-spacing:.12em}
.earn{display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px 14px;border-radius:var(--r-m);background:rgba(46,91,255,.12);color:var(--blue-hi);font-weight:600;font-size:14px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .c-item{transition:none}
}
</style>

</head>
<body>
<div class="stage">
  <aside class="pitch" aria-label="Про демо">
    <div class="brand"><span class="brand-mark" data-brand-mark></span><span class="brand-name" data-brand></span></div>
    <h1>Застосунок для вашого прокату авто</h1>
    <p>Інтерактивне демо. Натискайте на екрані телефона або оберіть сценарій нижче.</p>
    <ol id="pitchList">
      <li><button data-act="jump" data-to="home"><span class="label">01</span>Каталог за класами</button></li>
      <li><button data-act="jump" data-to="booking"><span class="label">02</span>Календар вільних дат</button></li>
      <li><button data-act="jump" data-to="rewards"><span class="label">03</span>Токени та рівні клієнта</button></li>
      <li><button data-act="jump" data-to="gifts"><span class="label">04</span>Подарункові сертифікати</button></li>

function setupCarousel(){
  const tr=$("#carousel");if(!tr)return;
  const items=[...tr.children];let raf=0;
  const upd=()=>{raf=0;const r=tr.getBoundingClientRect();const cx=r.left+r.width/2;let best=null,bd=1e9;
    items.forEach(el=>{const b=el.getBoundingClientRect();const c=b.left+b.width/2;const d=Math.min(Math.abs(c-cx)/(r.width*.62),1);el.style.setProperty("--d",d.toFixed(3));if(Math.abs(c-cx)<bd){bd=Math.abs(c-cx);best=el}});
    if(best&&best.dataset.id!==S.focusId){S.focusId=best.dataset.id;renderFocus()}};
  tr.addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(upd)},{passive:true});
  const i=items.findIndex(e=>e.dataset.id===S.focusId);
  if(i>0){tr.style.scrollSnapType="none";tr.scrollLeft=items[i].offsetLeft-(tr.clientWidth-items[i].offsetWidth)/2;requestAnimationFrame(()=>tr.style.scrollSnapType="")}
  requestAnimationFrame(upd);
  document.fonts&&document.fonts.ready.then(()=>requestAnimationFrame(upd));
}

function rangeFree(car,a,b){for(let d=new Date(a);d<=b;d=addDays(d,1))if(freeUnits(car,d)<1)return false;return true}
function defaultRange(car){
  for(let i=1;i<40;i++){const a=addDays(today0,i),b=addDays(a,3);if(rangeFree(car,a,b))return [a,b]}
  return [addDays(today0,1),addDays(today0,2)];
}
function calc(){
  const c=carById(S.carId);
  const days=S.end?Math.max(1,diffDays(S.start,S.end)):1;
  const rate=rateFor(c,days), base=rate*days;
  const lvl=currentLevel(USER.rentals), disc=Math.round(base*lvl.pct/100);
  const optSum=optionList(c).filter(o=>S.opts.has(o.id)).reduce((s,o)=>s+o.price*days,0);
  const place=PLACES.find(p=>p.id===S.place), fee=lvl.id==="black"?0:place.fee;
  const tokenMax=Math.min(S.tokens,1000,Math.floor((base-disc)*.2));
  const tok=S.useTokens?tokenMax:0;
  const total=base-disc+optSum+fee-tok;
  return {c,days,rate,base,lvl,disc,optSum,place,fee,tokenMax,tok,total,earn:Math.round(total*.05)};
}

function gaugeSVG(pct,id){
  const a=200-220*pct/100,rad=a*Math.PI/180,kx=110+90*Math.cos(rad),ky=110-90*Math.sin(rad);
  return `<svg viewBox="0 0 220 160" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#1B3AB8"/><stop offset="1" stop-color="#7D98FF"/></linearGradient></defs>
  <path d="M25.4 140.8 A90 90 0 1 1 194.6 140.8" fill="none" stroke="#161B25" stroke-width="22" stroke-linecap="round"/>
  <path d="M25.4 140.8 A90 90 0 1 1 194.6 140.8" fill="none" stroke="url(#${id})" stroke-width="22" stroke-linecap="round" pathLength="100" stroke-dasharray="${pct} 100"/>
  <circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="13" fill="#fff"/><circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="5" fill="#2E5BFF"/></svg>`;
}

function closeSheet(){$("#sheet").innerHTML=""}

/* ===================== EVENTS ===================== */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t||t.disabled)return;
  const a=t.dataset.act;
  switch(a){
    case "tab": go(t.dataset.to,{reset:true});break;
    case "nav": go(t.dataset.to);break;
    case "jump": {
      closeSheet();
      if(t.dataset.to==="booking"){S.carId=S.carId||"rio";S.start=null;S.end=null;S.calMonth=null;S.calMsg="";S.hist=["home","detail"];S.screen="detail";go("booking",{push:false});}
      else if(t.dataset.to==="owner"){S.hist=["profile"];S.screen="profile";go("owner",{push:false})}
      else go(t.dataset.to,{reset:true});
      break;}
    case "back": back();break;
    case "cls": S.cls=t.dataset.cls;S.focusId=null;
      if(S.screen==="home"){renderHome();setupCarousel()}else{renderCatalog()}break;
    case "pick": {const tr=$("#carousel");const r=tr.getBoundingClientRect(),b=t.getBoundingClientRect();
      if(Math.abs((b.left+b.width/2)-(r.left+r.width/2))<20){openCar(t.dataset.id)}else scrollCarTo(t);break;}
    case "cprev": case "cnext": {const items=[...$("#carousel").children];const i=items.findIndex(x=>x.dataset.id===S.focusId);const n=items[Math.max(0,Math.min(items.length-1,i+(a==="cnext"?1:-1)))];scrollCarTo(n);break;}
    case "banner": {const bn=$("#banners");bn.scrollTo({left:bn.clientWidth*+t.dataset.i+12*+t.dataset.i,behavior:"smooth"});break;}
    case "open-car": openCar(t.dataset.id);break;
    case "fav": {const id=t.dataset.id;S.favs.has(id)?S.favs.delete(id):S.favs.add(id);store.set("favs",[...S.favs]);t.setAttribute("aria-pressed",String(S.favs.has(id)));break;}
    case "opt": {const id=t.dataset.id;S.opts.has(id)?S.opts.delete(id):S.opts.add(id);t.setAttribute("aria-pressed",String(S.opts.has(id)));if(S.screen==="booking")refreshBooking();break;}
    case "to-booking": S.start=null;S.end=null;S.calMonth=null;S.calMsg="";go("booking");break;
    case "strip": {const d=new Date(+t.dataset.t);const len=S.end?Math.max(1,diffDays(S.start,S.end)):3;setRange(d,addDays(d,len));S.calMonth=new Date(d.getFullYear(),d.getMonth(),1);refreshBooking();break;}
    case "day": {const d=new Date(+t.dataset.t);
      if(!S.start||S.end||d<=S.start){S.start=d;S.end=null;S.calMsg=""}
      else setRange(S.start,d);
      refreshBooking();break;}
    case "cal-prev": S.calMonth=new Date(S.calMonth.getFullYear(),S.calMonth.getMonth()-1,1);refreshBooking();break;
    case "cal-next": S.calMonth=new Date(S.calMonth.getFullYear(),S.calMonth.getMonth()+1,1);refreshBooking();break;
    case "time": S.time=t.dataset.v;t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));break;
    case "place": S.place=t.dataset.v;t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));refreshBooking();break;
    case "tokens": S.useTokens=!S.useTokens;refreshBooking();break;
    case "confirm": confirmBooking();break;
    case "close-sheet": closeSheet();break;
    case "scrim": if(e.target===t)closeSheet();break;
    case "gift-amt": S.gift.amount=+t.dataset.v;S.gift.exp=null;renderGifts();break;
    case "gift-exp": S.gift.exp=S.gift.exp===t.dataset.v?null:t.dataset.v;renderGifts();break;
    case "occ": S.gift.occasion=t.dataset.v;t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));break;
    case "copy": {const txt=t.dataset.v;navigator.clipboard?.writeText(txt).then(()=>{t.textContent="Скопійовано"}).catch(()=>{const r=document.createRange();r.selectNodeContents(t.previousElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r)});break;}
    case "go-profile": closeSheet();go("profile",{reset:true});break;
    case "contact": S.form.contact=t.dataset.v;t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));break;
    case "gift-ch": S.sent.channel=t.dataset.v;giftSheet();break;
    case "gift-send": {const d=S.sent.dest.trim(),ch=S.sent.channel;let err="";
      if(ch==="Email"&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d))err="Вкажіть email, наприклад name@gmail.com";
      else if(ch==="Telegram"&&!(d.startsWith("@")&&d.length>2)&&d.replace(/\D/g,"").length<9)err="Вкажіть @нік у Telegram або номер телефону";
      else if((ch==="Viber"||ch==="SMS")&&d.replace(/\D/g,"").length<9)err="Вкажіть номер телефону отримувача";
      if(err){giftSheet(err);return}
      S.sent.done=true;giftSheet();break;}
    case "gift-preview": giftPreview();break;
    case "gift-activate": t.outerHTML=`<div class="sent">${ic("check")}<span>Сертифікат додано в гаманець отримувача</span></div>`;break;
  }
});
function setRange(a,b){
  const c=carById(S.carId);
  if(diffDays(a,b)>30){S.start=a;S.end=null;S.calMsg="Максимальний термін оренди 30 діб. Для довшої оренди напишіть нам";return}
  if(!rangeFree(c,a,b)){S.start=a;S.end=null;S.calMsg="У цьому періоді авто вже заброньоване. Оберіть іншу дату повернення або інше авто";return}
  S.start=a;S.end=b;S.calMsg="";
}
function openCar(id){S.carId=id;S.opts=new Set();go("detail")}
const fmtPhone=d=>{d=d.replace(/\D/g,"").slice(0,9);return [d.slice(0,2),d.slice(2,5),d.slice(5,7),d.slice(7,9)].filter(Boolean).join(" ")};

  bookingForm();
}

  <form class="stack" style="gap:14px" id="bookForm" novalidate>
    <div class="field ${errs.name?"bad":""}"><label class="label" for="bf-name">Ім'я та прізвище</label><input id="bf-name" value="${esc(f.name)}" autocomplete="name">${errs.name?`<span class="err" role="alert">${errs.name}</span>`:""}</div>
    <div class="field ${errs.phone?"bad":""}"><label class="label" for="bf-phone">Телефон</label><div class="phone"><span>+380</span><input id="bf-phone" type="tel" inputmode="numeric" value="${fmtPhone(f.phone)}" placeholder="67 123 45 67" autocomplete="tel-national"></div>${errs.phone?`<span class="err" role="alert">${errs.phone}</span>`:""}</div>
    ${pl==="door"?`<div class="field ${errs.addr?"bad":""}"><label class="label" for="bf-addr">Адреса подачі</label><input id="bf-addr" value="${esc(f.addr)}" placeholder="Вулиця, будинок, під'їзд" autocomplete="street-address">${errs.addr?`<span class="err" role="alert">${errs.addr}</span>`:""}</div>`:""}
    ${pl==="kbp"?`<div class="field"><label class="label" for="bf-flight">Номер рейсу <span style="text-transform:none;letter-spacing:0">(необов'язково)</span></label><input id="bf-flight" value="${esc(f.flight)}" placeholder="PS 102"></div>`:""}
    <div class="field"><span class="label">${timeLbl} · ${fmtDate(S.start)}</span><div class="seg" role="group" aria-label="${timeLbl}">${TIMES.map(t=>`<button type="button" data-act="time" data-v="${t}" aria-pressed="${S.time===t}" class="num">${t}</button>`).join("")}</div></div>
    <div class="field"><span class="label">Як з вами зв'язатися</span><div class="seg" role="group" aria-label="Зв'язок">${["Дзвінок","Telegram","Viber"].map(c=>`<button type="button" data-act="contact" data-v="${c}" aria-pressed="${f.contact===c}">${c}</button>`).join("")}</div></div>
    <div class="sum-row total"><span>До сплати</span><span class="num">${money(k.total)}</span></div>
    <button class="btn btn-blue" type="submit" style="height:56px;font-size:16px">${ic("key")} Підтвердити бронювання</button>
    <p class="note" style="margin:0;text-align:center">Натискаючи, ви погоджуєтесь з умовами оренди. Демо: оплата не проводиться.</p>
  </form>`);
  setTimeout(()=>{const el=errs.name?$("#bf-name"):errs.phone?$("#bf-phone"):errs.addr?$("#bf-addr"):null;el&&el.focus()},60);
}
function submitBooking(){
  const f=S.form,errs={};
  if(f.name.trim().length<2)errs.name="Вкажіть ім'я, щоб менеджер знав, до кого звертатися";
  if(f.phone.replace(/\D/g,"").length!==9)errs.phone="Номер має містити 9 цифр після +380";
  if(S.place==="door"&&f.addr.trim().length<5)errs.addr="Вкажіть вулицю й номер будинку, куди подати авто";
  if(Object.keys(errs).length){bookingForm(errs);return}
  const k=calc(),code="PZ-"+String(Math.floor(1000+Math.random()*9000));
  S.tokens-=k.tok;
  const where=S.place==="door"?f.addr:k.place.name;
  S.trips.unshift({car:k.c.id,code,dates:`${fmtDate(S.start)} → ${fmtDate(S.end)}`,time:S.time});
  openSheet(`<div class="steps" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="success-ic">${ic("check")}</div><h2 id="sh-t">Бронь підтверджено</h2>
    <p class="lead">${esc(k.c.make+" "+k.c.model)} · ${fmtDate(S.start)} → ${fmtDate(S.end)}<br>${S.place==="door"?"Подача":"Видача"} о ${S.time} · ${esc(where)}</p>
    <div class="codebox"><div><span class="label">Код бронювання</span><br><b>${code}</b></div><button class="btn btn-ghost" data-act="copy" data-v="${code}">Копіювати</button></div>
    <div class="earn">${ic("token")}<span>+${k.earn} токенів нарахуємо після поїздки</span></div>
    <div class="sum-row total" style="margin-top:14px"><span>Сплачено</span><span class="num">${money(k.total)}</span></div>
    <p class="note">${f.contact==="Дзвінок"?"Менеджер зателефонує":"Менеджер напише в "+f.contact} на +380 ${fmtPhone(f.phone)} за годину до ${S.place==="door"?"подачі":"видачі"}. Демо: реальна оплата не проводиться.</p>
    <div style="display:grid;gap:8px;margin-top:16px"><button class="btn btn-blue" style="height:52px" data-act="go-profile">Мої поїздки</button><button class="btn btn-ghost" style="height:52px" data-act="close-sheet">Закрити</button></div>`);
}
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;$("#grid").innerHTML=gridHTML(filtered())}
  if(e.target.id==="g-to"){S.gift.to=e.target.value;const b=$("#cert .to b");if(b)b.textContent=S.gift.to||"…";$("#g-err").hidden=true}
  if(e.target.id==="g-msg"){S.gift.msg=e.target.value}
  if(e.target.id==="g-dest"){S.sent.dest=e.target.value}
  if(e.target.id==="bf-name"){S.form.name=e.target.value}
  if(e.target.id==="bf-addr"){S.form.addr=e.target.value}
  if(e.target.id==="bf-flight"){S.form.flight=e.target.value}
  if(e.target.id==="bf-phone"){let d=e.target.value.replace(/\D/g,"");if(d.startsWith("380"))d=d.slice(3);if(d.startsWith("0"))d=d.slice(1);S.form.phone=d.slice(0,9);e.target.value=fmtPhone(S.form.phone)}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="bookForm"){e.preventDefault();submitBooking();return}
  if(e.target.id!=="giftForm")return;e.preventDefault();
  if(!S.gift.to.trim()){$("#g-err").hidden=false;$("#g-to").focus();return}
  const exp=S.gift.exp?EXPERIENCES.find(x=>x.id===S.gift.exp):null,amt=exp?exp.price:S.gift.amount;
  const code="PZ-"+Math.random().toString(36).slice(2,6).toUpperCase()+"-2026";
  S.sent={exp,amt,code,channel:"Telegram",dest:"",done:false};
  giftSheet();
});
function giftSheet(err=""){
  const t=S.sent,g=S.gift;
  const ph={Telegram:"@нік або +380…",Viber:"+380 67 123 45 67",SMS:"+380 67 123 45 67","Email":"name@gmail.com"}[t.channel];
  openSheet(`<h2 id="sh-t">Сертифікат оформлено</h2><p class="lead">Для: ${esc(g.to)}. Залишилось надіслати листівку</p>
    ${certHTML({exp:t.exp,amount:t.amt,to:g.to,code:t.code,cls:"mini"})}
    ${t.done?`<div class="sent">${ic("check")}<span>Листівку надіслано в ${t.channel}: ${esc(t.dest)}</span></div>
      <div style="display:grid;gap:8px;margin-top:14px"><button class="btn btn-blue" style="height:52px" data-act="gift-preview">Як її побачить отримувач</button><button class="btn btn-ghost" style="height:52px" data-act="close-sheet">Готово</button></div>
      <p class="note" style="text-align:center">Демо: повідомлення насправді не надсилається.</p>`
    :`<div class="section-h" style="margin-top:4px"><h2>Надіслати онлайн-листівку</h2></div>
      <div class="channels" role="group" aria-label="Канал">${[["Telegram","arrow"],["Viber","msg"],["SMS","msg"],["Email","doc"]].map(([c,i])=>`<button data-act="gift-ch" data-v="${c}" aria-pressed="${t.channel===c}">${ic(i)}${c}</button>`).join("")}</div>
      <div class="field ${err?"bad":""}" style="margin-top:12px"><label class="label" for="g-dest">Кому надіслати</label><input id="g-dest" value="${esc(t.dest)}" placeholder="${ph}" autocomplete="off">${err?`<span class="err" role="alert">${err}</span>`:""}</div>
      <div style="display:grid;gap:8px;margin-top:14px"><button class="btn btn-blue" style="height:52px" data-act="gift-send">${ic("gift")} Надіслати листівку</button>
      <button class="btn btn-ghost" style="height:52px" data-act="copy" data-v="https://pizno.app/g/${t.code}">Скопіювати посилання</button></div>
      <p class="note" style="text-align:center">Код сертифіката <b class="mono" style="color:var(--text)">${t.code}</b> діє 12 місяців</p>`}`);
}
function giftPreview(){
  const t=S.sent,g=S.gift;
  openSheet(`<div class="greet-card"><span class="label">${esc(g.occasion)}</span><h2 id="sh-t">${esc(g.to)}, вам подарунок!</h2><p class="lead" style="margin:0">від ${USER.first} через PIZNO</p></div>
    ${certHTML({exp:t.exp,amount:t.amt,to:g.to,code:t.code,cls:"mini flip"})}
    ${g.msg?`<div class="greet-card"><blockquote>${esc(g.msg)}</blockquote></div>`:""}
    <div style="display:grid;gap:8px"><button class="btn btn-blue" style="height:52px" data-act="gift-activate">${ic("key")} Активувати в PIZNO</button><button class="btn btn-ghost" style="height:52px" data-act="close-sheet">Закрити</button></div>
    <p class="note" style="text-align:center">Так листівку побачить отримувач за посиланням. Демо.</p>`);
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheet").innerHTML)closeSheet()});

/* ===================== BOOT ===================== */
document.querySelectorAll("[data-brand]").forEach(e=>e.outerHTML=wordmark(30));
document.querySelectorAll("[data-brand-mark]").forEach(e=>e.innerHTML=keyMark());
go("home",{reset:true});
(()=>{const sp=$("#splash");sp.querySelector(".splash-duck").innerHTML=DUCK;sp.querySelector(".splash-word").innerHTML=wordmark(44);
  const hide=()=>sp.classList.add("out");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)hide();else setTimeout(hide,1400);
  sp.addEventListener("click",hide)})();
</script>

</body>
</html>
